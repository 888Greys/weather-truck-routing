<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" role="img" aria-labelledby="fig-record-title fig-record-desc" font-family="JetBrains Mono, ui-monospace, monospace" fill="var(--m-ink, #1a1a1a)">
  <title id="fig-record-title">the checkpoint record</title>
  <desc id="fig-record-desc">Eight fields each checkpoint carries from Django to the map: miles, eta, wind_mph, rain_in_hr, snow_in_hr, level, driver and reasons.</desc>
  <text x="20" y="22" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">THE RECORD</text>
  <text x="330" y="22" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">WHAT EACH FIELD IS FOR</text>
  <rect x="20" y="32" width="300" height="28" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="32" y="51" font-size="12.5" font-weight="700">checkpoint</text>
  <rect x="20" y="60" width="300" height="28" fill="var(--m-paper, #fafaf5)" stroke="var(--m-paper, #fafaf5)"/>
  <text x="32" y="78" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">miles</text>
  <text x="150" y="78" font-size="12">0 .. 299.4</text>
  <line x1="306" y1="74" x2="324" y2="74" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="330" y="78" font-size="11" class="m-serif" font-family="Source Serif 4, Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">distance from the origin</text>
  <rect x="20" y="88" width="300" height="28" fill="var(--m-paper, #fafaf5)" stroke="var(--m-paper, #fafaf5)"/>
  <text x="32" y="106" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">eta</text>
  <text x="150" y="106" font-size="12">2026-10-24T15:27Z</text>
  <line x1="306" y1="102" x2="324" y2="102" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="330" y="106" font-size="11" class="m-serif" font-family="Source Serif 4, Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">the instant the truck is there</text>
  <rect x="20" y="116" width="300" height="28" fill="var(--m-paper, #fafaf5)" stroke="var(--m-paper, #fafaf5)"/>
  <text x="32" y="134" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">wind_mph</text>
  <text x="150" y="134" font-size="12">9.0</text>
  <line x1="306" y1="130" x2="324" y2="130" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="330" y="134" font-size="11" class="m-serif" font-family="Source Serif 4, Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">forecast wind at that hour</text>
  <rect x="20" y="144" width="300" height="28" fill="var(--m-paper, #fafaf5)" stroke="var(--m-paper, #fafaf5)"/>
  <text x="32" y="162" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">rain_in_hr</text>
  <text x="150" y="162" font-size="12">0.00</text>
  <line x1="306" y1="158" x2="324" y2="158" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="330" y="162" font-size="11" class="m-serif" font-family="Source Serif 4, Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">forecast rain rate</text>
  <rect x="20" y="172" width="300" height="28" fill="var(--m-paper, #fafaf5)" stroke="var(--m-paper, #fafaf5)"/>
  <text x="32" y="190" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">snow_in_hr</text>
  <text x="150" y="190" font-size="12">0.00</text>
  <line x1="306" y1="186" x2="324" y2="186" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="330" y="190" font-size="11" class="m-serif" font-family="Source Serif 4, Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">forecast snowfall rate</text>
  <rect x="20" y="200" width="300" height="28" fill="var(--m-paper, #fafaf5)" stroke="var(--m-paper, #fafaf5)"/>
  <text x="32" y="218" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">level</text>
  <text x="150" y="218" font-size="12">0</text>
  <line x1="306" y1="214" x2="324" y2="214" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="330" y="218" font-size="11" class="m-serif" font-family="Source Serif 4, Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">0 Low .. 4 No Travel</text>
  <rect x="20" y="228" width="300" height="28" fill="var(--m-paper, #fafaf5)" stroke="var(--m-paper, #fafaf5)"/>
  <text x="32" y="246" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">driver</text>
  <text x="150" y="246" font-size="12">wind</text>
  <line x1="306" y1="242" x2="324" y2="242" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="330" y="246" font-size="11" class="m-serif" font-family="Source Serif 4, Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">which condition decided it</text>
  <rect x="20" y="256" width="300" height="28" fill="var(--m-paper, #fafaf5)" stroke="var(--m-paper, #fafaf5)"/>
  <text x="32" y="274" font-size="12" fill="var(--m-ink-soft, #4a4a4a)">reasons</text>
  <text x="150" y="274" font-size="12">wind 9 mph</text>
  <line x1="306" y1="270" x2="324" y2="270" stroke="var(--m-teal-ink, #18696a)" stroke-width="1"/>
  <text x="330" y="274" font-size="11" class="m-serif" font-family="Source Serif 4, Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">the rule that fired, in words</text>
</svg>
