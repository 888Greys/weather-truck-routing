<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" role="img" aria-labelledby="fig-decision-title fig-decision-desc" font-family="JetBrains Mono, ui-monospace, monospace" fill="var(--m-ink, #1a1a1a)">
  <title id="fig-decision-title">three conditions, one level</title>
  <desc id="fig-decision-desc">Wind, rain and snow are classified separately, the worst wins, then the load escalation rules run and can only raise the level, ending at one of five levels.</desc>
  <defs><marker id="fig-decision-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-decision-head-plum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-plum-ink, #8a3d72)"/></marker><marker id="fig-decision-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker></defs>
  <text x="20" y="26" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">ONE CHECKPOINT</text>
  <rect x="20" y="40" width="180" height="44" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="110" y="60" font-size="12.5" text-anchor="middle" font-weight="700">wind_mph</text>
  <text x="110" y="74" font-size="11" text-anchor="middle" class="m-serif" font-family="Source Serif 4, Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">classify_wind()</text>
  <rect x="230" y="40" width="180" height="44" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="320" y="60" font-size="12.5" text-anchor="middle" font-weight="700">rain_in_hr</text>
  <text x="320" y="74" font-size="11" text-anchor="middle" class="m-serif" font-family="Source Serif 4, Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">classify_rain()</text>
  <rect x="440" y="40" width="180" height="44" fill="var(--m-violet-fill, #ebe8f5)" stroke="var(--m-violet-ink, #5b4fa3)"/>
  <text x="530" y="60" font-size="12.5" text-anchor="middle" font-weight="700">snow_in_hr</text>
  <text x="530" y="74" font-size="11" text-anchor="middle" class="m-serif" font-family="Source Serif 4, Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">classify_snow()</text>
  <line x1="110" y1="84" x2="150" y2="124" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-decision-head-ink)"/>
  <line x1="320" y1="84" x2="320" y2="124" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-decision-head-ink)"/>
  <line x1="530" y1="84" x2="490" y2="124" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-decision-head-ink)"/>
  <rect x="150" y="124" width="340" height="44" fill="var(--m-grey-fill, #ecebe3)" stroke="var(--m-grey-ink, #5e5e59)"/>
  <text x="320" y="144" font-size="12.5" text-anchor="middle" font-weight="700">max of the three</text>
  <text x="320" y="158" font-size="11" text-anchor="middle" class="m-serif" font-family="Source Serif 4, Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">the worst condition wins</text>
  <line x1="320" y1="168" x2="320" y2="202" stroke="var(--m-plum-ink, #8a3d72)" stroke-width="1.2" marker-end="url(#fig-decision-head-plum)"/>
  <text x="334" y="190" font-size="11" class="m-serif" font-family="Source Serif 4, Georgia, serif" fill="var(--m-ink-mute, #6f6f6a)">then</text>
  <rect x="20" y="202" width="580" height="92" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="32" y="220" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">LOAD ESCALATION</text>
  <text x="32" y="242" font-size="11.5">wind ≥ 55 mph → No Travel, any load</text>
  <text x="32" y="264" font-size="11.5">wind 45-54 mph and load &gt; 30,000 lb → No Travel</text>
  <text x="32" y="286" font-size="11.5">wind 35-44 mph and load &gt; 40,000 lb → Severe</text>
  <line x1="320" y1="294" x2="320" y2="326" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-decision-head-amber)"/>
  <rect x="20" y="326" width="108" height="40" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="74" y="351" font-size="12.5" text-anchor="middle" font-weight="700">Low</text>
  <rect x="138" y="326" width="108" height="40" fill="var(--m-olive-fill, #eef0dc)" stroke="var(--m-olive-ink, #515f26)"/>
  <text x="192" y="351" font-size="12.5" text-anchor="middle" font-weight="700">Moderate</text>
  <rect x="256" y="326" width="108" height="40" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="310" y="351" font-size="12.5" text-anchor="middle" font-weight="700">High</text>
  <rect x="374" y="326" width="108" height="40" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="428" y="351" font-size="12.5" text-anchor="middle" font-weight="700">Severe</text>
  <rect x="492" y="326" width="108" height="40" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <rect x="495" y="329" width="102" height="34" fill="none" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="546" y="351" font-size="12.5" text-anchor="middle" font-weight="700">No Travel</text>
  <text x="20" y="392" font-size="11" class="m-serif" font-family="Source Serif 4, Georgia, serif" fill="var(--m-ink-mute, #6f6f6a)">double border: a terminal level · escalation only raises, never lowers</text>
</svg>
